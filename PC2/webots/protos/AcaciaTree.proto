#VRML_SIM R2025a utf8
PROTO AcaciaTree [
  field SFVec3f    translation  0 0 0
  field SFRotation rotation     0 0 1 0
  field SFString   name         ""
  field SFFloat    height       8
  field SFFloat    trunkRadius  0.15
  field SFFloat    canopyRadius 4
]
{
  Solid {
    translation IS translation
    rotation IS rotation
    name IS name
    children [
      # Trunk
      Shape {
        appearance PBRAppearance {
          baseColor 0.45 0.30 0.15
          roughness 0.9
          metalness 0
        }
        geometry Cylinder {
          radius IS trunkRadius
          height IS height
          subdivision 8
        }
      }
      # Main canopy (umbrella shape - flattened sphere)
      Transform {
        translation 0 0 %{=fields.height.value * 0.85}%
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0.35 0.50 0.20
              roughness 0.8
              metalness 0
            }
            geometry Sphere {
              radius IS canopyRadius
              subdivision 3
            }
          }
        ]
      }
      # Secondary canopy (wider, flatter)
      Transform {
        translation 0 0 %{=fields.height.value * 0.75}%
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0.30 0.45 0.18
              roughness 0.8
              metalness 0
            }
            geometry Sphere {
              radius %{=fields.canopyRadius.value * 1.3}%
              subdivision 3
            }
          }
        ]
      }
    ]
    boundingObject Group {
      children [
        Transform {
          translation 0 0 %{=fields.height.value * 0.4}%
          children [
            Cylinder {
              radius %{=fields.canopyRadius.value * 1.4}%
              height %{=fields.height.value * 0.6}%
            }
          ]
        }
      ]
    }
  }
}
