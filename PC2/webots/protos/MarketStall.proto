#VRML_SIM R2025a utf8
PROTO MarketStall [
  field SFVec3f    translation  0 0 0
  field SFRotation rotation     0 0 1 0
  field SFString   name         ""
  field SFColor    awningColor  0.85 0.30 0.20
]
{
  Solid {
    translation IS translation
    rotation IS rotation
    name IS name
    children [
      # Posts (4 corners)
      Transform { translation -1.2 -1.2 0 children [ Shape { appearance PBRAppearance { baseColor 0.5 0.35 0.2 roughness 0.9 } geometry Cylinder { radius 0.08 height 2.5 } } ] }
      Transform { translation 1.2 -1.2 0 children [ Shape { appearance PBRAppearance { baseColor 0.5 0.35 0.2 roughness 0.9 } geometry Cylinder { radius 0.08 height 2.5 } } ] }
      Transform { translation -1.2 1.2 0 children [ Shape { appearance PBRAppearance { baseColor 0.5 0.35 0.2 roughness 0.9 } geometry Cylinder { radius 0.08 height 2.5 } } ] }
      Transform { translation 1.2 1.2 0 children [ Shape { appearance PBRAppearance { baseColor 0.5 0.35 0.2 roughness 0.9 } geometry Cylinder { radius 0.08 height 2.5 } } ] }
      # Awning
      Transform {
        translation 0 0 2.5
        children [
          Shape {
            appearance PBRAppearance {
              baseColor IS awningColor
              roughness 0.8
            }
            geometry Box {
              size 2.8 2.8 0.05
            }
          }
        ]
      }
      # Table
      Transform {
        translation 0 0 1.0
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0.6 0.4 0.25
              roughness 0.9
            }
            geometry Box {
              size 2.0 1.0 0.1
            }
          }
        ]
      }
      # Goods on table
      Transform { translation 0.5 0 1.15 children [ Shape { appearance PBRAppearance { baseColor 0.9 0.4 0.2 } geometry Sphere { radius 0.12 } } ] }
      Transform { translation -0.3 0 1.15 children [ Shape { appearance PBRAppearance { baseColor 0.2 0.7 0.3 } geometry Sphere { radius 0.12 } } ] }
      Transform { translation 0.6 0.2 1.2 children [ Shape { appearance PBRAppearance { baseColor 0.9 0.8 0.15 } geometry Sphere { radius 0.1 } } ] }
    ]
    boundingObject Box { size 2.8 2.8 2.6 }
  }
}
