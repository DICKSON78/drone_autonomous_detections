services:

  # Webots runs natively on the host (not in Docker).
  # The MAVLink bridge controller provides PX4-compatible telemetry on UDP :14550.
  # Launch with: PC2/start_webots.sh

  # Object Detection Service (YOLOv8)
  object-detection:
    build: ./src/object-detection
    container_name: object-detection
    ports:
      - "8002:8002"
    depends_on:
      - kafka-bridge
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=${PC1_IP:-kafka}:9092
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./config:/app/config
      - ./logs:/app/logs
    networks:
      - fyp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # RL Navigation Service
  rl-navigation:
    build: ./src/rl-navigation
    container_name: rl-navigation
    ports:
      - "8003:8003"
    depends_on:
      - kafka-bridge
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=${PC1_IP:-kafka}:9092
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./config:/app/config
      - ./logs:/app/logs
    networks:
      - fyp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3

# Kafka Bridge
  kafka-bridge:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka-bridge
    environment:
      - KAFKA_HOST=${PC1_IP:-kafka}
    command: |
      sh -c "
      echo 'client.id=bridge-client
      bootstrap.servers=${PC1_IP:-kafka}:9092' > /tmp/bridge.properties &&
      kafka-topics --bootstrap-server ${PC1_IP:-kafka}:9092 --list &&
      tail -f /dev/null
      "
    networks:
      - fyp-network

networks:
  fyp-network:
    name: fyp-network
    external: true